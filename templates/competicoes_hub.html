<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Competições — Aço &amp; Folha</title>
<meta name="theme-color" content="#3B5D42">
<link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topbar">
  <h1>Competições</h1>
  <p class="topbar__subtitle">Aço &amp; Folha</p>
  <p class="topbar__user">
    <a href="{{ url_for('home') }}">‹ Início</a>
  </p>
</header>

<main class="wrap">
  <div class="hub-list">
    {% for key, cfg in itens %}
    <a class="hub-card" href="{{ url_for('competicao_swordplay') if key == 'swordplay' else url_for('competicao_pontuar', key=key) }}">
      <span class="hub-card__icon" aria-hidden="true">{{ cfg.icon }}</span>
      <span class="hub-card__label">{{ cfg.label }}</span>
      <span class="hub-card__arrow" aria-hidden="true">›</span>
    </a>
    {% endfor %}
  </div>
</main>

</body>
</html>
