<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Código da equipe — Aço &amp; Folha</title>
<meta name="theme-color" content="#3B5D42">
<link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topbar">
  <h1>Aço &amp; Folha</h1>
  <p class="topbar__subtitle">Acesso da equipe</p>
  <p class="topbar__user">
    <a href="{{ url_for('home') }}">‹ Início</a>
  </p>
</header>

<main class="wrap login-wrap">

  {% if erro %}
  <div class="banner banner--error">{{ erro }}</div>
  {% endif %}

  <section class="card login-card">
    <p class="login-card__text">
      Digite o código da equipe, passado pela organização.
      Ele é pedido uma vez só neste celular.
    </p>
    <form method="post" action="{{ url_for('entrar_equipe') }}" class="codigo-form">
      <input type="hidden" name="next" value="{{ next }}">
      <input type="text" name="codigo" class="codigo-form__campo" inputmode="numeric"
             autocomplete="off" autofocus required aria-label="Código da equipe" placeholder="Código">
      <button type="submit" class="btn btn--primary">Entrar</button>
    </form>
  </section>

  <p class="legal-links">
    É da organização?
    <a href="{{ url_for('login', next=next) }}">Entre com a sua Conta Google</a>.
  </p>

</main>

</body>
</html>
